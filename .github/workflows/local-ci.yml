name: CI Proyecto Muebles
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - laboratorio/dockerizacion

  pull_request:
    branches:
      - laboratorio/dockerizacion

  workflow_dispatch:

jobs:

  backend:
    name: Backend .NET + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d auth_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: Host=localhost;Port=5432;Database=auth_db;Username=postgres;Password=postgres;Include Error Detail=true

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: |
          dotnet restore backend/services/FurnitureStore.sln

      - name: Build backend
        run: |
          dotnet build backend/services/FurnitureStore.sln \
            --configuration Release \
            --no-restore

      - name: Test backend
        run: |
          dotnet test backend/services/FurnitureStore.sln \
            --configuration Release \
            --no-build \
            --logger trx \
            --results-directory TestResults/backend

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/backend


  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --run

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:9190
        run: npm run build

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/reports
            reports

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AuthService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/AuthService
          push: true
          tags: |
            ghcr.io/legm121/muebles-authservice:latest
            ghcr.io/legm121/muebles-authservice:${{ github.sha }}

      - name: Build CatalogService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/CatalogService
          push: true
          tags: |
            ghcr.io/legm121/muebles-catalogservice:latest
            ghcr.io/legm121/muebles-catalogservice:${{ github.sha }}

      - name: Build InventoryService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/InventoryService
          push: true
          tags: |
            ghcr.io/legm121/muebles-inventoryservice:latest
            ghcr.io/legm121/muebles-inventoryservice:${{ github.sha }}

      - name: Build CartService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/CartService
          push: true
          tags: |
            ghcr.io/legm121/muebles-cartservice:latest
            ghcr.io/legm121/muebles-cartservice:${{ github.sha }}

      - name: Build OrderService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/OrderService
          push: true
          tags: |
            ghcr.io/legm121/muebles-orderservice:latest
            ghcr.io/legm121/muebles-orderservice:${{ github.sha }}

      - name: Build PaymentService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/PaymentService
          push: true
          tags: |
            ghcr.io/legm121/muebles-paymentservice:latest
            ghcr.io/legm121/muebles-paymentservice:${{ github.sha }}

      - name: Build API Gateway
        uses: docker/build-push-action@v6
        with:
          context: backend/node-api-gateway
          push: true
          tags: |
            ghcr.io/legm121/muebles-api-gateway:latest
            ghcr.io/legm121/muebles-api-gateway:${{ github.sha }}

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/legm121/muebles-frontend:latest
            ghcr.io/legm121/muebles-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://muebles-api-gateway-latest.onrender.com 

  deploy-render:
    name: Deploy all services to Render
    runs-on: ubuntu-latest
    needs:
      - docker-build

    steps:
      - name: Deploy AuthService
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_AUTH_DEPLOY_HOOK }}"

      - name: Deploy CatalogService
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_CATALOG_DEPLOY_HOOK }}"

      - name: Deploy InventoryService
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_INVENTORY_DEPLOY_HOOK }}"

      - name: Deploy CartService
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_CART_DEPLOY_HOOK }}"

      - name: Deploy OrderService
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_ORDER_DEPLOY_HOOK }}"

      - name: Deploy PaymentService
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_PAYMENT_DEPLOY_HOOK }}"

      - name: Deploy API Gateway
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_GATEWAY_DEPLOY_HOOK }}"

      - name: Deploy Frontend
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
  smoke-tests:
    name: Smoke Tests Production
    runs-on: ubuntu-latest

    needs:
      - deploy-render

    env:
      AUTH_URL: https://muebles-authservice.onrender.com
      CATALOG_URL: https://muebles-catalogservice-latest.onrender.com
      CART_URL: https://muebles-cartservice-latest.onrender.com
      ORDER_URL: https://muebles-orderservice-latest.onrender.com
      PAYMENT_URL: https://muebles-paymentservice-latest.onrender.com
      INVENTORY_URL: https://muebles-inventoryservice-latest.onrender.com
      GATEWAY_URL: https://muebles-api-gateway-latest.onrender.com
      FRONTEND_URL: https://muebles-frontend-latest.onrender.com
    steps:
      - name: Wait for Render services
        run: |
          echo "Waiting for Render deployments to start..."
          sleep 30

      - name: Smoke test AuthService
        run: |
          curl --fail --show-error --silent \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            "${AUTH_URL}/health"

      - name: Smoke test CatalogService
        run: |

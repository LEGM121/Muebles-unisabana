name: CI Proyecto Muebles

on:
  push:
    branches:
      - laboratorio/dockerizacion

  pull_request:
    branches:
      - laboratorio/dockerizacion

  workflow_dispatch:

jobs:

  backend:
    name: Backend .NET + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d auth_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: Host=localhost;Port=5432;Database=auth_db;Username=postgres;Password=postgres;Include Error Detail=true

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: |
          dotnet restore backend/services/FurnitureStore.sln

      - name: Build backend
        run: |
          dotnet build backend/services/FurnitureStore.sln \
            --configuration Release \
            --no-restore

      - name: Test backend
        run: |
          dotnet test backend/services/FurnitureStore.sln \
            --configuration Release \
            --no-build \
            --logger trx \
            --results-directory TestResults/backend

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/backend


  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --run

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:9190
        run: npm run build

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            frontend/reports
            reports

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AuthService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/AuthService
          push: false
          tags: proyecto-muebles/authservice:ci

      - name: Build CatalogService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/CatalogService
          push: false
          tags: proyecto-muebles/catalogservice:ci

      - name: Build InventoryService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/InventoryService
          push: false
          tags: proyecto-muebles/inventoryservice:ci

      - name: Build CartService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/CartService
          push: false
          tags: proyecto-muebles/cartservice:ci

      - name: Build OrderService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/OrderService
          push: false
          tags: proyecto-muebles/orderservice:ci

      - name: Build PaymentService
        uses: docker/build-push-action@v6
        with:
          context: backend/services/PaymentService
          push: false
          tags: proyecto-muebles/paymentservice:ci

      - name: Build API Gateway
        uses: docker/build-push-action@v6
        with:
          context: backend/node-api-gateway
          push: false
          tags: proyecto-muebles/api-gateway:ci

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: proyecto-muebles/frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:9190

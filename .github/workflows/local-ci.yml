name: Local CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend:
    name: Backend .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore backend
        run: dotnet restore backend/services/FurnitureStore.sln

      - name: Build backend
        run: dotnet build backend/services/FurnitureStore.sln --no-restore --configuration Release

      - name: Test backend
        run: dotnet test backend/services/FurnitureStore.sln --no-build --configuration Release --logger trx --results-directory TestResults/backend

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/backend

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test -- --run

      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: |
            reports
            frontend/reports

      - name: Build frontend
        run: npm run build

  integration:
    name: Docker Integration
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          echo "Esperando que los servicios inicien..."
          sleep 45

      - name: Verify Gateway
        run: |
          curl --fail http://localhost:9090 || exit 1

      - name: Verify Frontend
        run: |
          curl --fail http://localhost:5173 || exit 1

      - name: Show running containers
        if: always()
        run: docker ps

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v        